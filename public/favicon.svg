<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="48" height="48">
  <!--
    Claude Virtual Agents のファビコン — ボスのハロ(球体マスコット)。

    座標系は public/character.js の figure 座標をそのまま使う(球体の中心が原点、
    半径 22)。BOSS 定数から写した値なので、character.js 側の造形を変えても
    **ここは自動では追従しない**(手書きの別管理。DESIGN.md 4.26 参照)。

    16px で潰れないよう、canvas 側の造形から次の 4 点だけ変えてある。値はどれも
    実機 Chrome がタブ用に作る 16px ビットマップを実測して決めた:
      ・耳を描かない … 既定は伏せた状態でシルエットは真円なので、そもそも見えない
      ・目を大きく   … ボス寸法(2.6 x 5.0)は 16px で 0.9px 幅になって消えるため、
                       サブ(HALO の 3.5 x 6.4)とほぼ同じ 3.6 x 6.4 まで上げた
      ・口を深く     … drawBossShell は端点 y=4 / 制御点 y+6(垂れ 3 単位)だが、
                       16px での実効の垂れは 0.41px しかなく水平な線に見えた。
                       **口全体を上げて(端点 y=2)垂れを深く**(制御点 14.5)して
                       ある。**ここだけ式が canvas と違う**。端点を上げたのは、
                       垂れだけ深くすると下半球の青が痩せるため
                       ※実効の垂れは端点ではなく **制御点と端点の差 C−E** で決まる。
                         端点(円周上の x=±21.909)は 16px だとリムの下に隠れるので、
                         見えるのは内側の 10 列だけ。実測 ≒ 0.065 × (C−E) px なので、
                         C−E=6 は実測 0.41px、いまの C−E=12.5 は実測 0.77px
      ・輪郭を 1 本  … 上半球が白(#f4f2ea)なので、白いタブ背景だと上半分が
                       消えて「青い三日月」に見える。濃い青のリムで球体の輪郭を
                       出す(球面に描き込まない方針は canvas の話で別問題)。
                       線幅 1.5 では 16px で 0.5px にしかならずコントラストが
                       1.6〜2.2:1 だったため 2.4(0.8px)にした
    機体色は #65 でセッションごとに変わるが、ファビコンは既定色 #3b82c4 で固定。
    タブの背景色はブラウザ側なので prefers-color-scheme による切り替えもしない。
  -->
  <circle r="22" fill="#f4f2ea"/>
  <!-- 下半球。境界の曲線がそのまま口に見える。円弧の端点 ±21.909 = √(22² − 2²) は
       端点の高さ 2 から解いた値なので、**端点を動かすならこの x も解き直す** -->
  <path d="M-21.909 2 Q0 14.5 21.909 2 A22 22 0 0 1 -21.909 2 Z" fill="#3b82c4"/>
  <!-- リムは内側に描く。r + 線幅/2 = 20.8 + 1.2 = 22 なので外形は球体のまま -->
  <circle r="20.8" fill="none" stroke="#295b89" stroke-width="2.4"/>
  <ellipse cx="-8.4" cy="-3.5" rx="3.6" ry="6.4" fill="#8fe36a"/>
  <ellipse cx="8.4" cy="-3.5" rx="3.6" ry="6.4" fill="#8fe36a"/>
</svg>
